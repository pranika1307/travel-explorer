<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Travel Explorer 🌎</h1>
            <p>Your journey to discovery starts here.</p>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <input type="text" id="city-input" placeholder="Enter a city or destination...">
            <button id="search-btn">Explore</button>
        </section>

        <section class="destination-info" id="destination-info">
            <h2 id="destination-name"></h2>
            
            <div class="info-grid">
                <div class="weather-card">
                    <h3>Current Weather ☀️</h3>
                    <div id="weather-data">
                        <p>Search for a city to see the weather.</p>
                    </div>
                </div>

                <div class="image-gallery">
                    <h3>Photos of <span id="gallery-name"></span> 📸</h3>
                    <div class="photo-grid" id="photo-grid">
                        <p>Photos will appear here.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
