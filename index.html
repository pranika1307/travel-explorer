<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌍 Travel Explorer</h1>
    <p>Plan your trip with ease — explore destinations, view photos & check the weather</p>
  </header>

  <!-- API status bar -->
  <section id="apiStatus" class="api-status">
    <p>Checking API keys...</p>
  </section>

  <main>
    <section class="search-section">
      <input type="text" id="destinationInput" placeholder="Enter a destination...">
      <button onclick="searchDestination()">Search</button>
    </section>

    <section class="result-section">
      <div id="photoContainer" class="photo-container"></div>
      <div id="weatherContainer" class="weather-container"></div>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ | Travel Explorer Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
