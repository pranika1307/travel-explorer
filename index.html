<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌍 Travel Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌍 Travel Explorer</h1>
    <p>Plan your trip with ease — explore destinations, view photos & check the weather</p>
  </header>

  <!-- API status -->
  <section id="apiStatus" class="api-status">
    <p>Checking API keys...</p>
  </section>

  <!-- Search bar -->
  <section id="searchSection">
    <input type="text" id="destinationInput" placeholder="Enter a destination...">
    <button id="searchBtn">Search</button>
  </section>

  <!-- Results -->
  <main>
    <section id="photos">
      <h2>📸 Destination Photos</h2>
      <div id="photoContainer" class="photo-grid"></div>
    </section>

    <section id="weather">
      <h2>☀️ Weather Information</h2>
      <div id="weatherContainer"></div>
    </section>
  </main>

  <footer>
    <p>Made with ❤️ for travel lovers</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
